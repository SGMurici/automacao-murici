name: Gmail workflow tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [gmail-production-integration]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  gmail-readonly-triage:
    if: >-
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[run-gmail-triage]')
    needs: [unit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run read-only Gmail triage and retain summary only
        env:
          GMAIL_MONITOR_SECRET: ${{ secrets.GMAIL_MONITOR_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GMAIL_MONITOR_SECRET}" ]]; then
            echo "GMAIL_MONITOR_SECRET is not configured in repository Actions secrets."
            exit 1
          fi

          response_file="${RUNNER_TEMP}/gmail-triage-summary.json"
          http_status="$(curl --silent --show-error \
            --output "${response_file}" \
            --write-out "%{http_code}" \
            --request POST \
            --header "X-Gmail-Monitor-Secret: ${GMAIL_MONITOR_SECRET}" \
            "https://automacao-murici-testes-controlados.onrender.com/internal/gmail/triage/run?summary_only=true")"

          if [[ ! "${http_status}" =~ ^2[0-9][0-9]$ ]]; then
            echo "Gmail triage endpoint returned HTTP ${http_status}. Response content was withheld."
            exit 1
          fi

          python - "${response_file}" "${http_status}" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              report = json.load(source)

          def safe_counts(value):
              if not isinstance(value, dict):
                  return {}
              return {
                  str(name): count for name, count in value.items()
                  if isinstance(count, int) and not isinstance(count, bool)
                  and 0 <= count <= 10000 and len(str(name)) <= 80
              }

          print(f"HTTP: {sys.argv[2]}")
          print(f"Status: {report.get('status', 'not_provided')}")
          accounts = report.get("accounts", {})
          if isinstance(accounts, dict):
              print(f"Accounts processed: {len(accounts)}")
              for account_name, result in sorted(accounts.items()):
                  if not isinstance(result, dict):
                      continue
                  status = result.get("status", "not_provided")
                  summary = result.get("summary", {})
                  if not isinstance(summary, dict):
                      summary = {}
                  total = summary.get("total", "not_provided")
                  print(f"{account_name}: status={status}; total={total}")
                  print("  categories=" + json.dumps(safe_counts(summary.get("categories")), sort_keys=True))
                  print("  priorities=" + json.dumps(safe_counts(summary.get("priorities")), sort_keys=True))

          summary = report.get("summary", {})
          if isinstance(summary, dict):
              print(f"Overall total: {summary.get('total', 'not_provided')}")
              print("Overall categories: " + json.dumps(safe_counts(summary.get("categories")), sort_keys=True))
              print("Overall priorities: " + json.dumps(safe_counts(summary.get("priorities")), sort_keys=True))
          print("Individual message details were not emitted to the workflow log.")
          PY

          rm -f "${response_file}"
