name: Backend regression tests

on:
  pull_request:
    branches:
      - main
      - fix/foundation-batch-2026-11-10
      - 'fix/**'
      - 'feat/**'
      - 'integration/**'
  push:
    branches:
      - fix/foundation-batch-2026-11-10
      - 'fix/**'
      - 'feat/**'
      - 'integration/**'

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kappa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kappa_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kappa_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile application
        run: python -m py_compile app.py
      - name: Run regression and PostgreSQL integration tests
        run: python -m unittest discover -s tests -v
