name: Python syntax check

on:
  pull_request:
    branches: [main]
  push:
    branches: [ai-code-executor-bootstrap]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python modules
        run: python -m py_compile app.py
